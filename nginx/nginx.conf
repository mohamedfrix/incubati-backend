events {
    worker_connections 1024;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=storage_limit:10m rate=20r/s;

    # Upstream servers
    upstream api_gateway {
        server api-gateway:4000;
    }

    upstream minio_server {
        server minio:9000;
    }

    upstream minio_console {
        server minio:9001;
    }

    server {
        listen 80;
        server_name localhost;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API Gateway routes (handles auth, applications, documents)
        location /api/ {
            # Rate limiting
            limit_req zone=api_limit burst=20 nodelay;

            # Remove /api prefix and proxy to API Gateway
            rewrite ^/api/(.*)$ /$1 break;
            
            proxy_pass http://api_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings for file uploads
            client_max_body_size 20M;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # MinIO Storage routes
        location /storage/ {
            # Rate limiting for storage
            limit_req zone=storage_limit burst=50 nodelay;

            # Remove /storage prefix and proxy to MinIO
            rewrite ^/storage/(.*)$ /$1 break;
            
            proxy_pass http://minio_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # MinIO specific headers
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Server $host;
            
            # Large file support
            client_max_body_size 100M;
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Timeouts for large uploads/downloads
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # MinIO Console (Admin interface) - Optional, for development
        location /minio-console/ {
            # Remove /minio-console prefix and proxy to MinIO Console
            rewrite ^/minio-console/(.*)$ /$1 break;
            
            proxy_pass http://minio_console;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            
            # WebSocket support for MinIO Console
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Fallback for root - can serve a simple API documentation or redirect
        location / {
            return 200 '{"message":"Incubati Backend API","endpoints":{"/api/":"REST API Gateway","/storage/":"File Storage","/minio-console/":"Storage Admin"},"note":"gRPC communication is internal only"}';
            add_header Content-Type application/json;
        }

        # Error pages
        error_page 404 /404.html;
        location = /404.html {
            return 404 '{"error":"Endpoint not found"}';
            add_header Content-Type application/json;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            return 500 '{"error":"Internal server error"}';
            add_header Content-Type application/json;
        }
    }
}
