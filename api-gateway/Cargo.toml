[package]
name = "api-gateway"
version = "0.1.0"
edition = "2024"
resolver = "2"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
async-trait = "0.1"
tokio = { version = "1.42", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
lettre = { version = "0.11", features = ["tokio1-native-tls"] }
jsonwebtoken = "9.3"
dotenv = "0.15"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
rand = "0.8"
rand_core = "0.6"
password-hash = "0.5"
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "seeder"
path = "src/bin/seeder.rs"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
